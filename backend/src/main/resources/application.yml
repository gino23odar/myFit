spring:
  application:
    name: wardrove-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/wardrove}
    username: ${SPRING_DATASOURCE_USERNAME:wardrove}
    password: ${SPRING_DATASOURCE_PASSWORD:wardrove}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

wardrove:
  auth:
    jwt:
      secret: ${WARDROVE_JWT_SECRET:local-development-secret-key-change-me-please-32-bytes}
      access-token-ttl: ${WARDROVE_ACCESS_TOKEN_TTL:15m}
      refresh-token-ttl: ${WARDROVE_REFRESH_TOKEN_TTL:30d}
